[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sustainable-ai-auditor"
version = "0.1.0"
description = "Lifecycle carbon auditor for AI systems"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "google-genai>=2.3.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
